<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Contacts — Kite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../app.css" />
</head>
<body>
  <div class="screen" data-od-id="screen-contacts">
    <div class="status-space"></div>

    <header class="app-header" data-od-id="contacts-header">
      <div class="header-row">
        <h1 class="title">Contacts</h1>
        <button class="icon-btn" aria-label="Ajouter un contact">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 19h6m-3-3v6"/><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
        </button>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" placeholder="Rechercher un contact" aria-label="Rechercher un contact" />
      </div>
    </header>

    <main class="list" data-od-id="contacts-list">
      <p class="section-label">Actions rapides</p>
      <div class="quick-actions">
        <button class="qa"><span class="qa-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 8a5 5 0 1 0-10 0c0 5-3 6-3 6h16s-3-1-3-6"/><path d="M10 20a2.5 2.5 0 0 0 4 0"/></svg></span>Nouveau groupe</button>
        <button class="qa"><span class="qa-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>Nouvel événement</button>
        <button class="qa"><span class="qa-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>Nouvelle diffusion</button>
        <button class="qa"><span class="qa-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 5h18M8 12h13M3 19h8"/></svg></span>Gérer les listes</button>
      </div>

      <p class="section-label">Favoris</p>

      <div class="contact-row" tabindex="0">
        <div class="avatar av-1">LU</div>
        <div class="contact-main">
          <div class="contact-name">Lucas
            <svg class="fav" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.3.8-4.6 4.3 1.2 6.3-5.6-3-5.6 3 1.2-6.3L3 9.4l6.3-.8L12 3Z"/></svg>
          </div>
          <div class="contact-desc">en ligne</div>
        </div>
      </div>
      <div class="contact-row" tabindex="0">
        <div class="avatar av-3">EM</div>
        <div class="contact-main">
          <div class="contact-name">Emma
            <svg class="fav" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.3.8-4.6 4.3 1.2 6.3-5.6-3-5.6 3 1.2-6.3L3 9.4l6.3-.8L12 3Z"/></svg>
          </div>
          <div class="contact-desc">vu il y a 12 min</div>
        </div>
      </div>

      <p class="section-label">Tous les contacts</p>

      <div class="contact-row" tabindex="0">
        <div class="avatar av-2">AN</div>
        <div class="contact-main">
          <div class="contact-name">Antoine</div>
          <div class="contact-desc">Disponible · réponses rapides</div>
        </div>
      </div>

      <div class="contact-row" tabindex="0">
        <div class="avatar av-3">CA</div>
        <div class="contact-main">
          <div class="contact-name">Camille</div>
          <div class="contact-desc">Occupée</div>
        </div>
      </div>

      <div class="contact-row" tabindex="0">
        <div class="avatar av-1">HU</div>
        <div class="contact-main">
          <div class="contact-name">Hugo</div>
          <div class="contact-desc">Gamer nocturne</div>
        </div>
      </div>

      <div class="contact-row" tabindex="0">
        <div class="avatar av-2">LE</div>
        <div class="contact-main">
          <div class="contact-name">Léa</div>
          <div class="contact-desc">Architecte d'intérieur</div>
        </div>
      </div>

      <div class="contact-row" tabindex="0">
        <div class="avatar av-3">MA</div>
        <div class="contact-main">
          <div class="contact-name">Marc</div>
          <div class="contact-desc">Travail</div>
        </div>
      </div>

      <div class="contact-row" tabindex="0">
        <div class="avatar av-1">SO</div>
        <div class="contact-main">
          <div class="contact-name">Sophie</div>
          <div class="contact-desc">Photographe</div>
        </div>
      </div>

      <div class="contact-row" tabindex="0">
        <div class="avatar av-2">TH</div>
        <div class="contact-main">
          <div class="contact-name">Thomas</div>
          <div class="contact-desc">Projet Nova</div>
        </div>
      </div>

      <div class="row-card" data-od-id="invited-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h16v16H4z" opacity="0"/><path d="m22 2-7 20-4-9-9-4 20-7Z"/></svg>
        <span>Inviter un ami sur Kite</span>
      </div>
    </main>

    <div class="fab-wrap">
      <button class="fab" aria-label="Nouveau contact">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>
  <script>
    const t = localStorage.getItem('kite-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
    window.addEventListener('storage', () => {
      const v = localStorage.getItem('kite-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', v);
    });
  </script>
  <script src="../theme-sync.js"></script>
</body>
</html>
