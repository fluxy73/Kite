<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Frame — iPhone 15 Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body{margin:0;padding:0;height:100%;background:transparent;font-family:sans-serif}
    .frame{position:relative;width:390px;height:844px;margin:0 auto;background:#1a1a1d;border-radius:54px;border:12px solid #2d2d33;box-sizing:border-box}
    .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:190px;height:26px;background:#1a1a1d;border-radius:0 0 24px 24px;z-index:2}
    .notch-small{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:100px;height:6px;background:#1a1a1d;border-radius:3px;z-index:2}
    .screen-area{position:absolute;top:34px;left:12px;right:12px;bottom:12px;border-radius:42px;overflow:hidden;background:#0a0a0c}
    .screen-area iframe{display:block;width:100%;height:100%;border:none;background:transparent}
  </style>
</head>
<body>
  <div class="frame">
    <div class="notch"></div>
    <div class="notch-small"></div>
    <div class="screen-area" id="sa">
      <iframe id="f" loading="lazy"></iframe>
    </div>
  </div>
  <script>
    const sp = new URLSearchParams(location.search);
    const s = sp.get('screen');
    if (s) document.getElementById('f').src = s;
    // Theme sync from parent
    const tgt = window.parent;
    const syncTheme = () => { try { const t = localStorage.getItem('kite-theme')||'dark'; document.documentElement.setAttribute('data-theme', t); } catch(e){} };
    syncTheme();
    window.addEventListener('storage', syncTheme);
  </script>
</body>
</html>
