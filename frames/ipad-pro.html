<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Frame — iPad Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body{margin:0;padding:0;height:100%;background:transparent;font-family:sans-serif}
    .frame{position:relative;width:834px;height:1194px;margin:0 auto;background:#1a1a1d;border:10px solid #252528;border-radius:24px;box-sizing:border-box}
    .home-bar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:160px;height:4px;background:#242428;border-radius:2px;z-index:2}
    .screen-area{position:absolute;top:10px;left:10px;right:10px;bottom:40px;border-radius:12px;overflow:hidden;background:#0a0a0c}
    .screen-area iframe{display:block;width:100%;height:100%;border:none;background:transparent}
  </style>
</head>
<body>
  <div class="frame">
    <div class="screen-area" id="sa">
      <iframe id="f" loading="lazy"></iframe>
    </div>
    <div class="home-bar"></div>
  </div>
  <script>
    const sp = new URLSearchParams(location.search);
    const s = sp.get('screen');
    if (s) document.getElementById('f').src = s;
    const syncTheme = () => { try { const t = localStorage.getItem('kite-theme')||'dark'; document.documentElement.setAttribute('data-theme', t); } catch(e){} };
    syncTheme();
    window.addEventListener('storage', syncTheme);
  </script>
</body>
</html>
