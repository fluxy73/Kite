<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Appels — Kite</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --surface: #141416;
      --surface-2: #1c1c20;
      --fg: #ececea;
      --muted: #8e8e93;
      --border: #242428;
      --accent: #d9985f;
      --accent-ink: #14100c;
      --tint-1: #8b9cf5;
      --tint-2: #57c9a3;
      --tint-3: #e0b268;
      --accent-soft: color-mix(in oklch, var(--accent) 16%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 7%, transparent);
      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: var(--font-body); font-size: 15px; line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    svg { display: block; }
    button { font: inherit; cursor: pointer; }
    .screen { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    .status-space { flex: 0 0 8px; }

    .app-header { flex: 0 0 auto; padding: 0 16px 10px; }
    .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .title { font-family: var(--font-display); font-size: 26px; letter-spacing: -0.01em; margin: 0; font-weight: 500; }
    .icon-btn {
      width: 38px; height: 38px; border: none; border-radius: 50%;
      background: transparent; color: var(--fg); display: grid; place-items: center;
    }
    .icon-btn:hover { background: var(--fg-soft); }
    .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon-btn svg { width: 20px; height: 20px; }

    .list { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; }
    .section-label {
      padding: 14px 16px 6px;
      font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted);
    }
    .call-row {
      display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center;
      padding: 11px 16px;
    }
    .call-row:hover { background: var(--fg-soft); }
    .call-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 12px; }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      display: grid; place-items: center; font-size: 16px; font-weight: 600;
    }
    .av-1 { background: color-mix(in oklch, var(--tint-1) 20%, var(--surface-2)); color: var(--tint-1); }
    .av-2 { background: color-mix(in oklch, var(--tint-2) 20%, var(--surface-2)); color: var(--tint-2); }
    .av-3 { background: color-mix(in oklch, var(--tint-3) 20%, var(--surface-2)); color: var(--tint-3); }
    .call-main { min-width: 0; }
    .call-name { font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; }
    .dir { display: inline-flex; }
    .dir svg { width: 13px; height: 13px; }
    .dir.out { color: var(--muted); }
    .dir.in { color: var(--tint-2); }
    .dir.missed { color: #e5735f; transform: rotate(135deg); }
    .call-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
    .call-meta .mono { font-family: var(--font-mono); font-size: 11.5px; }
    .call-actions { display: flex; gap: 4px; }
    .call-btn {
      width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
      background: transparent; color: var(--fg); display: grid; place-items: center;
    }
    .call-btn:hover { border-color: var(--accent); color: var(--accent); }
    .call-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .call-btn svg { width: 17px; height: 17px; }
    .call-btn.video { margin-left: 4px; }

    .start-card {
      margin: 6px 12px 16px; padding: 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      display: flex; gap: 14px; align-items: center;
    }
    .start-ring {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent);
      display: grid; place-items: center; flex: 0 0 auto;
    }
    .start-ring svg { width: 22px; height: 22px; }
    .start-card b { font-weight: 600; display: block; }
    .start-card small { color: var(--muted); font-size: 12.5px; }
    .start-btn {
      margin-left: auto; border: 1px solid var(--border); background: transparent; color: var(--fg);
      border-radius: 999px; padding: 8px 16px; font-size: 13px;
    }
    .start-btn:hover { border-color: var(--accent); color: var(--accent); }

    .tabbar {
      flex: 0 0 auto; display: flex; justify-content: space-around;
      border-top: 1px solid var(--border);
      background: color-mix(in oklch, var(--bg) 88%, transparent);
      backdrop-filter: blur(10px); padding: 6px 8px 16px;
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: var(--muted); font-size: 10px; letter-spacing: .04em;
      padding: 6px 14px; border-radius: 12px; background: transparent; border: none;
    }
    .tab:hover { color: var(--fg); }
    .tab.active { color: var(--accent); }
    .tab svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div class="screen" data-od-id="screen-calls">
    <div class="status-space"></div>

    <header class="app-header" data-od-id="calls-header">
      <div class="header-row">
        <h1 class="title">Appels</h1>
        <button class="icon-btn" aria-label="Nouvel appel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>

    <main class="list" data-od-id="calls-list">
      <p class="section-label">Récents</p>

      <div class="start-card" data-od-id="start-call-card">
        <span class="start-ring">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>
        </span>
        <span><b>Créer un lien d'appel</b><small>Partagez-le pour rejoindre la conversation</small></span>
        <button class="start-btn">Créer</button>
      </div>

      <div class="call-row" tabindex="0">
        <div class="avatar av-1">LU</div>
        <div class="call-main">
          <div class="call-name">Lucas
            <span class="dir in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></span>
          </div>
          <div class="call-meta">Aujourd'hui · <span class="mono">12 min</span></div>
        </div>
        <div class="call-actions">
          <button class="call-btn" aria-label="Rappeler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></button>
          <button class="call-btn video" aria-label="Appel vidéo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3v10l-6-3"/></svg></button>
        </div>
      </div>

      <div class="call-row" tabindex="0">
        <div class="avatar av-3">EM</div>
        <div class="call-main">
          <div class="call-name">Emma
            <span class="dir missed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></span>
          </div>
          <div class="call-meta">Aujourd'hui · <span class="mono">manqué</span></div>
        </div>
        <div class="call-actions">
          <button class="call-btn" aria-label="Rappeler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></button>
          <button class="call-btn video" aria-label="Appel vidéo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3v10l-6-3"/></svg></button>
        </div>
      </div>

      <div class="call-row" tabindex="0">
        <div class="avatar av-2">PR</div>
        <div class="call-main">
          <div class="call-name">Projet Nova · réunion
            <span class="dir out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></span>
          </div>
          <div class="call-meta">Hier · <span class="mono">45 min · 6 participants</span></div>
        </div>
        <div class="call-actions">
          <button class="call-btn" aria-label="Rappeler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></button>
          <button class="call-btn video" aria-label="Appel vidéo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3v10l-6-3"/></svg></button>
        </div>
      </div>

      <div class="call-row" tabindex="0">
        <div class="avatar av-2">CA</div>
        <div class="call-main">
          <div class="call-name">Camille
            <span class="dir out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></span>
          </div>
          <div class="call-meta">Hier · <span class="mono">3 min</span></div>
        </div>
        <div class="call-actions">
          <button class="call-btn" aria-label="Rappeler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></button>
          <button class="call-btn video" aria-label="Appel vidéo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3v10l-6-3"/></svg></button>
        </div>
      </div>

      <div class="call-row" tabindex="0">
        <div class="avatar av-3">SO</div>
        <div class="call-main">
          <div class="call-name">Sophie
            <span class="dir in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></span>
          </div>
          <div class="call-meta">Lundi · <span class="mono">22 min · vidéo</span></div>
        </div>
        <div class="call-actions">
          <button class="call-btn" aria-label="Rappeler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></button>
          <button class="call-btn video" aria-label="Appel vidéo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3v10l-6-3"/></svg></button>
        </div>
      </div>

      <div class="call-row" tabindex="0">
        <div class="avatar av-1">TH</div>
        <div class="call-main">
          <div class="call-name">Thomas
            <span class="dir missed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></span>
          </div>
          <div class="call-meta">Lundi · <span class="mono">manqué</span></div>
        </div>
        <div class="call-actions">
          <button class="call-btn" aria-label="Rappeler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></button>
          <button class="call-btn video" aria-label="Appel vidéo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3v10l-6-3"/></svg></button>
        </div>
      </div>
    </main>

    <nav class="tabbar" data-od-id="tabbar">
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/></svg>
        Discussions
      </button>
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        Communautés
      </button>
      <button class="tab active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>
        Appels
      </button>
    </nav>
  </div>
  <script>
    const t = localStorage.getItem('kite-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
    window.addEventListener('storage', () => {
      const v = localStorage.getItem('kite-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', v);
    });
  </script>
  <script src="../theme-sync.js"></script>
</body>
</html>
