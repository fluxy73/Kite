<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Appel en cours — Kite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../app.css" />
  <style>
    /* === In-call screen === */
    .call-screen { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; background: var(--bg); }

    .call-video { flex: 1; position: relative; background: var(--surface-2); display: flex; align-items: center; justify-content: center; }
    .call-video .remote-avatar {
      width: 160px; height: 160px; border-radius: 50%; font-size: 48px;
    }
    .call-video .remote-name { margin-top: 12px; font-family: var(--font-display); font-size: 22px; font-weight: 500; }

    .call-status-bar {
      position: absolute; top: 10px; left: 0; right: 0;
      display: flex; justify-content: center; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted); font-family: var(--font-mono);
    }
    .call-status-bar .rec { color: var(--accent); font-weight: 700; display: flex; align-items: center; gap: 4px; }

    /* picture-in-picture local preview */
    .local-preview {
      position: absolute; top: 12px; right: 12px;
      width: 80px; height: 100px; border-radius: 12px;
      background: var(--surface); border: 2px solid var(--border);
      display: grid; place-items: center; overflow: hidden;
    }
    .local-preview .avatar { width: 100%; height: 100%; border-radius: 0; font-size: 32px; }

    .call-controls {
      flex: 0 0 auto; padding: 20px 16px 40px;
      display: flex; align-items: center; justify-content: center; gap: 24px;
      background: color-mix(in oklch, var(--bg) 80%, transparent);
      border-top: 1px solid var(--border); backdrop-filter: blur(10px);
    }
    .cc-btn {
      width: 56px; height: 56px; border-radius: 50%; border: none;
      background: var(--surface); color: var(--fg);
      display: grid; place-items: center; font-size: 11px;
      box-shadow: 0 4px 16px -4px color-mix(in oklch,#000 40%,transparent);
    }
    .cc-btn:hover { background: var(--surface-2); }
    .cc-btn.active { background: var(--accent); color: var(--accent-ink); }
    .cc-btn svg { width: 22px; height: 22px; }
    .cc-hang {
      width: 68px; height: 68px; border-radius: 50%; border: none;
      background: #e5735f; color: var(--accent-ink);
      display: grid; place-items: center;
      box-shadow: 0 6px 24px -6px color-mix(in oklch,#e5735f 55%,transparent);
    }
    .cc-hang svg { width: 26px; height: 26px; }

    /* incoming call overlay */
    .incoming-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg); z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .incoming-overlay .inc-avatar {
      width: 100px; height: 100px; border-radius: 50%; font-size: 36px; margin-bottom: 8px;
    }
    .incoming-overlay .inc-name { font-family: var(--font-display); font-size: 28px; font-weight: 500; }
    .incoming-overlay .inc-status { font-size: 14px; color: var(--muted); margin-top: 4px; }
    .incoming-overlay .inc-time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 6px; }

    /* call timer animation */
    .call-timer {
      font-family: var(--font-mono); font-size: 13px; font-weight: 700;
      display: flex; align-items: center; gap: 6px;
    }
  </style>
</head>
<body>
  <div class="call-screen" data-od-id="screen-call">
    <div class="call-video" data-od-id="call-video">
      <div class="call-status-bar">
        <span class="rec">●</span> Enregistré localement
      </div>
      <div class="local-preview" data-od-id="local-preview">
        <div class="avatar av-2" style="width:100%;height:100%;border-radius:0">JD</div>
      </div>
      <div class="remote-avatar av-1">LU</div>
      <div class="remote-name">Lucas Martin</div>
      <div class="call-timer" data-od-id="call-timer">
        <span id="timer-display">00:00</span>
      </div>
      <div id="incoming" class="incoming-overlay" data-od-id="incoming-overlay" style="display:none">
        <div class="inc-avatar av-1">LU</div>
        <div class="inc-name">Lucas Martin</div>
        <div class="inc-status">Appel vidéo entrant</div>
        <div class="inc-time">Il y a 2 secondes</div>
      </div>
    </div>

    <div class="call-controls" data-od-id="call-controls">
      <button class="cc-btn" aria-label="Désactiver le micro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="cc-btn" aria-label="Désactiver la caméra">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 2l20 20"/><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3v10l-6-3"/></svg>
      </button>
      <button class="cc-hang" aria-label="Raccrocer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 5-3 6-3 6h12s-3-1-3-6M8 20h8v2a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button class="cc-btn" aria-label="Muet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 2l20 20"/><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="cc-btn" aria-label="Plus d'options">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
      </button>
    </div>
  </div>
  <script>
    const saved = localStorage.getItem('kite-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    // Timer simulation
    let seconds = 0;
    const display = document.getElementById('timer-display');
    setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      display.textContent = `${m}:${s}`;
    }, 1000);
  </script>
  <script src="../theme-sync.js"></script>
</body>
</html>
