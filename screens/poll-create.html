<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Créer un sondage — Kite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../app.css" />
  <style>
    .poll-screen { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    .poll-form { flex: 1; overflow-y: auto; padding: 16px; }
    .form-field { margin-bottom: 16px; }
    .form-field label {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: block;
    }
    .form-field input, .form-field textarea {
      width: 100%; padding: 12px 16px; border-radius: var(--radius-field);
      background: var(--surface); border: 1px solid var(--border); color: var(--fg);
      font: inherit; font-size: 15px; outline: none; resize: none;
    }
    .form-field input:focus, .form-field textarea:focus { border-color: color-mix(in oklch, var(--accent) 50%, var(--border)); }
    .form-field input::placeholder, .form-field textarea::placeholder { color: var(--muted); }

    .option-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .option-row input { flex: 1; }
    .option-row .opt-remove {
      width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2);
      display: grid; place-items: center; color: var(--muted); cursor: pointer;
    }
    .option-row .opt-remove:hover { color: var(--accent); background: var(--accent-soft); }
    .opt-add { margin-top: 6px; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 0; }
    .opt-add svg { width: 14px; height: 14px; margin-right: 4px; }

    .form-check {
      display: flex; align-items: center; gap: 10px; padding: 12px 16px;
      border-radius: 12px; cursor: pointer;
    }
    .form-check input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
    .form-check label { font-size: 13.5px; color: var(--fg); margin: 0; cursor: pointer; }

    .form-select {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-radius: 12px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface);
    }
    .form-select .left { display: flex; align-items: center; gap: 10px; }
    .form-select .left svg { width: 17px; height: 17px; color: var(--accent); }
    .form-select .label { font-size: 13.5px; font-weight: 500; }
    .form-select .right { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }

    .poll-footer {
      flex: 0 0 auto; padding: 12px 16px; border-top: 1px solid var(--border);
      background: var(--surface); display: flex; gap: 8px;
    }
  </style>
</head>
<body>
  <div class="poll-screen" data-od-id="screen-poll-create">
    <div class="status-space"></div>

    <header class="app-header" data-od-id="poll-header" style="border-bottom:1px solid var(--border)">
      <button class="icon-btn" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1 class="title">Nouveau sondage</h1>
      <button class="icon-btn" aria-label="Envoyer" id="poll-send" style="opacity:.35">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </header>

    <main class="poll-form" data-od-id="poll-form">
      <div class="form-field">
        <label>Question</label>
        <input type="text" placeholder="Quelle est votre question ?" id="poll-question" aria-label="Question du sondage" />
      </div>

      <div class="form-field">
        <label>Options</label>
        <div class="option-row">
          <input type="text" placeholder="Option 1" value="Restaurant" />
          <button class="opt-remove" aria-label="Supprimer l'option">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="option-row">
          <input type="text" placeholder="Option 2" value="Cinéma" />
          <button class="opt-remove" aria-label="Supprimer l'option">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="opt-add" id="opt-add" data-od-id="poll-add-option">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          Ajouter une option
        </div>
      </div>

      <div class="form-field">
        <label>Paramètres</label>
        <div class="form-check">
          <input type="checkbox" id="multi-vote" />
          <label for="multi-vote">Autoriser plusieurs réponses</label>
        </div>
        <div class="form-check" style="margin-top:6px">
          <input type="checkbox" id="anonymous" />
          <label for="anonymous">Votes anonymes</label>
        </div>
      </div>

      <div class="form-field">
        <label>Fin du sondage</label>
        <div class="form-select">
          <div class="left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
            <span class="label">Date de fin</span>
          </div>
          <span class="right">Aucune</span>
        </div>
      </div>

      <div class="form-field">
        <label>Rappel de fin</label>
        <div class="form-select">
          <div class="left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            <span class="label">Rappeler les participants</span>
          </div>
          <span class="right">15 min avant</span>
        </div>
      </div>
    </main>
  </div>

  <script>
    const saved = localStorage.getItem('kite-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    // Enable send when question has text
    const q = document.getElementById('poll-question');
    const s = document.getElementById('poll-send');
    q.addEventListener('input', () => {
      s.style.opacity = q.value.trim() ? '1' : '.35';
    });
    // Add option
    const addBtn = document.getElementById('opt-add');
    addBtn.addEventListener('click', () => {
      const newRow = document.createElement('div');
      newRow.className = 'option-row';
      newRow.innerHTML = `<input type="text" placeholder="Nouvelle option" />
        <button class="opt-remove" aria-label="Supprimer l'option"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;
      addBtn.parentNode.insertBefore(newRow, addBtn);
    });
  </script>
  <script src="../theme-sync.js"></script>
</body>
</html>
