<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Frame — Pixel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body{margin:0;padding:0;height:100%;background:transparent;font-family:sans-serif}
    .frame{position:relative;width:412px;height:915px;margin:0 auto;background:#0a0a0c;border:8px solid #2a2a30;border-radius:28px;box-sizing:border-box}
    .punch{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:80px;height:2px;border-left:6px solid #2a2a30;border-right:6px solid #2a2a30;z-index:2}
    .punch-i{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:#2a2a30;z-index:2}
    .screen-area{position:absolute;top:30px;left:8px;right:8px;bottom:78px;border-radius:20px;overflow:hidden;background:#0a0a0c}
    .screen-area iframe{display:block;width:100%;height:100%;border:none;background:transparent}
    .nav-bar{position:absolute;bottom:8px;left:8px;right:8px;height:60px;background:#141416;border-radius:24px;display:flex;align-items:center;justify-content:space-around;border:1px solid #242428;z-index:2}
    .nb-item{display:flex;flex-direction:column;align-items:center;justify-content:center;width:48px;height:40px;color:#8e8e93;font-size:9px}
    .nb-item.active{color:#d9985f}
    .nb-item svg{width:20px;height:20px}
    .gesture{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);width:100px;height:4px;background:#242428;border-radius:2px;z-index:2}
  </style>
</head>
<body>
  <div class="frame">
    <div class="punch"></div>
    <div class="punch-i"></div>
    <div class="screen-area" id="sa">
      <iframe id="f" loading="lazy"></iframe>
    </div>
    <div class="nav-bar">
      <div class="nb-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/></svg><span>Discussions</span></div>
      <div class="nb-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Communautés</span></div>
      <div class="nb-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg><span>Appels</span></div>
    </div>
    <div class="gesture"></div>
  </div>
  <script>
    const sp = new URLSearchParams(location.search);
    const s = sp.get('screen');
    if (s) document.getElementById('f').src = s;
    const syncTheme = () => { try { const t = localStorage.getItem('kite-theme')||'dark'; document.documentElement.setAttribute('data-theme', t); } catch(e){} };
    syncTheme();
    window.addEventListener('storage', syncTheme);
  </script>
</body>
</html>
