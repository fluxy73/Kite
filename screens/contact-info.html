<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Profil — Lucas — Kite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../app.css" />
<body>
  <div class="contact-info-screen" data-od-id="screen-contact-info">
    <div class="status-space"></div>

    <header class="app-header" data-od-id="contact-info-header" style="border-bottom:1px solid var(--border); justify-content:flex-start; gap:10px;">
      <button class="icon-btn" aria-label="Retour" onclick="location.href='contacts.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1 class="title" style="flex:1; text-align:center; margin:0;">Infos</h1>
      <button class="icon-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
      </button>
    </header>

    <main class="info-list" data-od-id="contact-info-list">
      <div class="contact-hero" data-od-id="contact-hero">
        <div class="avatar av-1">LU</div>
        <h2 class="name">Lucas Martin</h2>
        <div class="handle">@lucas.m</div>
        <div class="status"><span class="dot"></span> en ligne</div>
      </div>

      <div class="contact-actions" data-od-id="contact-actions">
        <div class="ca-btn" data-od-id="action-message" onclick="location.href='conversation.html'">
          <div class="ca-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/></svg></div>
          <span>Message</span>
        </div>
        <div class="ca-btn" data-od-id="action-call" onclick="location.href='call-screen.html'">
          <div class="ca-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></div>
          <span>Appel</span>
        </div>
        <div class="ca-btn" data-od-id="action-video">
          <div class="ca-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3v10l-6-3"/></svg></div>
          <span>Vidéo</span>
        </div>
        <div class="ca-btn" data-od-id="action-favorite">
          <div class="ca-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 2 12l4 2v8l4-2 4 2v-8l4-2z"/></svg></div>
          <span>Favori</span>
        </div>
        <div class="ca-btn" data-od-id="action-more">
          <div class="ca-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></div>
          <span>Plus</span>
        </div>
      </div>

      <div class="info-section" data-od-id="contact-details">
        <div class="sec-title">Détails</div>
        <div class="info-row">
          <div class="left">
            <div class="sr-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="7" r="5"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>
            <div class="info"><span class="label">Photo de profil</span></div>
          </div>
        </div>
        <div class="info-row">
          <div class="left">
            <div class="sr-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="20" r="8"/><path d="M12 14v-4a4 4 0 1 1 8 0v4"/></svg></div>
            <div class="info"><span class="label">Nom</span></div>
          </div>
          <span class="value">Lucas Martin</span>
        </div>
        <div class="info-row">
          <div class="left">
            <div class="sr-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 4H3v2l9 5 9-5z"/><path d="m5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 1 2-2V8"/></svg></div>
            <div class="info"><span class="label">Message éphémère</span></div>
          </div>
        </div>
      </div>

      <div class="info-section" data-od-id="shared-media">
        <div class="sec-title">Médias partagés</div>
        <div class="shared-media">
          <div class="thumb"></div><div class="thumb"></div><div class="thumb"></div>
          <div class="thumb"></div><div class="thumb"></div><div class="thumb"></div>
          <div class="thumb"></div><div class="thumb"></div><div class="thumb"></div>
          <div class="thumb"></div><div class="thumb"></div><div class="thumb"></div>
        </div>
      </div>

      <div class="info-section">
        <div class="sec-title">Actions</div>
        <div class="info-row" style="color:var(--danger)">
          <div class="left">
            <div class="sr-icon" style="color:var(--danger); background:color-mix(in oklch, var(--danger) 15%, transparent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 12a2 2 0 1 0 4 0 2 2 0 0 0-4 0zM12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/></svg></div>
            <div class="info"><span class="label">Bloquer ce contact</span></div>
          </div>
        </div>
      </div>
    </main>

    <nav class="tabbar" data-od-id="tabbar">
      <button class="tab" onclick="location.href='chat-list.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/></svg>Discussions</button>
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>Communautés</button>
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>Appels</button>
    </nav>
  </div>
  <script>
    const saved = localStorage.getItem('kite-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  </script>
  <script src="../theme-sync.js"></script>
</body>
</html>
